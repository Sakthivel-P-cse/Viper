apiVersion: v1
kind: Service
metadata:
  name: viper-peer
  labels:
    app.kubernetes.io/name: viper
    app.kubernetes.io/component: peer
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: viper
  ports:
    - name: peer
      port: 7301
      targetPort: peer
---
apiVersion: v1
kind: Service
metadata:
  name: viper-client
  labels:
    app.kubernetes.io/name: viper
    app.kubernetes.io/component: client
spec:
  selector:
    app.kubernetes.io/name: viper
  ports:
    - name: client
      port: 7401
      targetPort: client
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: viper-config-generator
  labels:
    app.kubernetes.io/name: viper
data:
  generate.sh: |
    #!/bin/sh
    set -eu
    suffix="${HOSTNAME##*-}"
    case "$suffix" in
      0) node="node-1" ;;
      1) node="node-2" ;;
      2) node="node-3" ;;
      *) echo "unsupported StatefulSet ordinal" >&2; exit 1 ;;
    esac
    umask 077
    cat > /work/server.json <<EOF
    {
      "node_id": "$node",
      "data_dir": "/var/lib/viper/data",
      "peer_listen": "0.0.0.0:7301",
      "client_listen": "0.0.0.0:7401",
      "peers": [
        {"id": "node-1", "address": "viper-0.viper-peer:7301", "server_name": "node-1"},
        {"id": "node-2", "address": "viper-1.viper-peer:7301", "server_name": "node-2"},
        {"id": "node-3", "address": "viper-2.viper-peer:7301", "server_name": "node-3"}
      ],
      "peer_tls": {
        "certificate": "/etc/viper/tls/$node.crt",
        "key": "/etc/viper/tls/$node.key",
        "ca": "/etc/viper/tls/cluster-ca.crt"
      },
      "client_tls": {
        "certificate": "/etc/viper/tls/client-server.crt",
        "key": "/etc/viper/tls/client-server.key",
        "ca": "/etc/viper/tls/client-ca.crt"
      },
      "allowed_clients": ["client-1"],
      "allowed_administrators": ["admin-1"],
      "max_concurrent_requests": 256,
      "max_requests_per_second": 1000,
      "max_in_flight_peer_requests": 64,
      "metrics_listen": "0.0.0.0:7501",
      "shutdown_timeout_millis": 30000
    }
    EOF
    chmod 0444 /work/server.json
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: viper
  labels:
    app.kubernetes.io/name: viper
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: viper
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: viper
  labels:
    app.kubernetes.io/name: viper
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: viper
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: viper
      ports:
        - protocol: TCP
          port: 7301
    - from:
        - namespaceSelector:
            matchLabels:
              viper-client-access: "true"
      ports:
        - protocol: TCP
          port: 7401
    - from:
        - namespaceSelector:
            matchLabels:
              viper-metrics-access: "true"
      ports:
        - protocol: TCP
          port: 7501
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: viper
      ports:
        - protocol: TCP
          port: 7301
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: viper
  labels:
    app.kubernetes.io/name: viper
spec:
  serviceName: viper-peer
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: viper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: viper
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: viper
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: generate-config
          image: busybox:1.36.1
          command: ["/bin/sh", "/config/generate.sh"]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: generated-config
              mountPath: /work
            - name: config-generator
              mountPath: /config
              readOnly: true
      containers:
        - name: viper
          image: ghcr.io/replace-with-your-org/viper:release
          imagePullPolicy: IfNotPresent
          args: ["serve", "-config", "/etc/viper/config.json"]
          ports:
            - name: peer
              containerPort: 7301
            - name: client
              containerPort: 7401
            - name: metrics
              containerPort: 7501
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: peer
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: peer
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: generated-config
              mountPath: /etc/viper/config.json
              subPath: server.json
              readOnly: true
            - name: viper-tls-secret
              mountPath: /etc/viper/tls
              readOnly: true
            - name: viper-data
              mountPath: /var/lib/viper
      volumes:
        - name: generated-config
          emptyDir: {}
        - name: config-generator
          configMap:
            name: viper-config-generator
            defaultMode: 0555
        - name: viper-tls-secret
          secret:
            secretName: viper-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: viper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
