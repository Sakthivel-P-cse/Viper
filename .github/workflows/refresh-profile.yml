name: Refresh profile art

on: push

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger profile refresh
        env:
          PROFILE_REFRESH_TOKEN: ${{ secrets.PROFILE_REFRESH_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PROFILE_REFRESH_TOKEN" \
            https://api.github.com/repos/Sakthivel-P-cse/Sakthivel-P-cse/actions/workflows/update-profile-art.yml/dispatches \
            -d '{"ref":"main"}'
