syntax = "proto3";

package viper.api.v1;

import "buf/validate/validate.proto";

option go_package = "viper/api/gen/v1;apiv1";

// RaftPeerService carries authenticated consensus traffic between nodes.
service RaftPeerService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9._:-]+$"
  }];
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message RaftLogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes command = 3 [(buf.validate.field).bytes.max_len = 3145728];
  uint32 checksum = 4;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9._:-]+$"
  }];
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated RaftLogEntry entries = 5 [(buf.validate.field).repeated.max_items = 256];
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
  uint64 conflict_term = 5;
}

// InstallSnapshotRequest transfers one checksummed chunk. next_offset in the
// response makes interrupted transfers resumable.
message InstallSnapshotRequest {
  uint64 term = 1;
  string leader_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9._:-]+$"
  }];
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  uint64 offset = 5;
  bytes data = 6 [(buf.validate.field).bytes.max_len = 1048576];
  bool done = 7;
  uint32 checksum = 8;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  uint64 next_offset = 2;
}
